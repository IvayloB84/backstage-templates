apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: spring-boot-4-gitops-service
  title: Java Microservice Platform Onboarding
  description: Provisions a Spring Boot 4 service via start.spring.io, provisions a Git repo, and registers ArgoCD GitOps tracking.
  tags:
    - java
    - spring-boot-4
    - gitops
    - argocd

spec:
  owner: platform-engineering
  type: service

  parameters:
    - title: "Step 1: Java Core Settings"
      required:
        - artifactId
        - javaVersion
        - repoOwner
      properties:
        groupId:
          title: Group ID
          type: string
          default: com.yourcompany.platform
        artifactId:
          title: Artifact ID / Repo Name
          type: string
          default: my-modern-java-service
        javaVersion:
          title: Java Version
          type: string
          default: "21"
          enum:
            - "17"
            - "21"
        dependencies:
          title: Starters
          type: array
          items:
            type: string
            # Real start.spring.io dependency IDs only.
            # Full current list: https://start.spring.io/metadata/client
            enum:
              - web
              - security
              - actuator
              - validation
              - lombok
              - data-jpa
          default:
            - web
            - security
        ui:widget:
      repoUrl:
        title: Repository Location
        type: string
        ui:field: RepoUrlPicker
        ui:options:
          allowedHosts:
            - github.com
          allowedOwners:
            - IvayloB84
        port:
          title: Container Port Allocation
          type: integer
          default: 8080
        gitopsToken:
          title: GitOps Push Token
          description: Fine-grained PAT scoped to ArgoCD-RootApps with Contents Read/write — injected into the new repo automatically so its CI can commit deploy updates back.
          type: string
          ui:field: Secret
      ui:schema:
        dependencies:
          ui:widget: checkboxes

  steps:
    # Renders pom.xml, Application.java, application.yml, catalog-info.yaml,
    # Dockerfile, and the GH Actions workflow — the developer-facing source
    # repo ONLY. K8s/ArgoCD manifests live separately, rendered by the
    # gitops step below into ArgoCD-RootApps instead of this repo.
    - id: append-catalog-metadata
      name: Generate Project From Skeleton
      action: fetch:template
      input:
        url: https://github.com/IvayloB84/backstage-templates/tree/main/skeleton/spring-boot-4/app
        # This file uses GitHub Actions' own ${{ }} expressions
        # (github.actor, secrets.GITHUB_TOKEN, etc.) — copy it verbatim
        # instead of running it through Nunjucks, or those get corrupted.
        copyWithoutRender:
          - .github/workflows/build-and-push.yml
        values:
          name: ${{ parameters.artifactId }}
          owner: ${{ parameters.repoOwner }}
          groupId: ${{ parameters.groupId }}
          javaVersion: ${{ parameters.javaVersion }}
          dependencies: ${{ parameters.dependencies }}
          port: ${{ parameters.port }}

    # STEP 3: Create the GitHub repository and push the generated code
    - id: publish-github-repository
      name: Provision New GitHub Repository
      action: publish:github
      input:
        description: 'Spring Boot 4 service scaffolded from the Internal Developer Platform'
        repoUrl: "github.com?repo=${{ parameters.artifactId }}&owner=${{ parameters.repoOwner }}"
        defaultBranch: main
        repoVisibility: public
        token: ${{ secrets.GITHUB_TOKEN }}

    # STEP 3a: Flip GITHUB_TOKEN to read/write for this repo's own Actions
    # runs. New personal-account repos default to read-only, which silently
    # caps what a workflow's own `permissions:` block can request — this is
    # the fix for the GHCR "permission_denied: write_package" error, and it
    # can't be done from the workflow YAML alone. Requires the /github-api
    # proxy entry added to app-config.yaml (see accompanying note).
    - id: enable-workflow-write
      name: Enable Read/Write Actions Permissions
      action: http:backstage:request
      input:
        method: PUT
        path: "/proxy/github-api/repos/${{ parameters.repoOwner }}/${{ parameters.artifactId }}/actions/permissions/workflow"
        headers:
          Content-Type: application/json
        body:
          default_workflow_permissions: write
          can_approve_pull_request_reviews: false

    # STEP 3b: Inject the GitOps push token as a repo secret via a
    # dedicated "production" Environment, so build-and-push.yml's
    # update-gitops-manifest job can authenticate without any manual
    # per-repo secret setup in the GitHub UI.
    - id: provision-gitops-secret
      name: Provision GitOps Push Secret
      action: github:environment:create
      input:
        repoUrl: "github.com?repo=${{ parameters.artifactId }}&owner=${{ parameters.repoOwner }}"
        name: production
        secrets:
          GITOPS_PAT: ${{ secrets.gitopsToken }}
        token: ${{ secrets.GITHUB_TOKEN }}

    # STEP 4: Local-cluster workaround — forward the GitHub webhook to ArgoCD via smee.io.
    # Not strictly required (ArgoCD self-heals via a ~3min poll by default), but since
    # ArgoCD can't reach a public webhook target from your localhost setup, this is the
    # only way to get near-instant sync instead of waiting on the poll interval.
    - id: create-webhook
      name: Link Developer Repo to ArgoCD Webhook (via smee.io)
      action: github:webhook
      input:
        repoUrl: "github.com?repo=${{ parameters.artifactId }}&owner=${{ parameters.repoOwner }}"
        webhookUrl: 'https://smee.io/vVvKlKpQsKv5zv0W'
        contentType: 'json'
        secret: ${{ secrets.ARGOCD_WEBHOOK_SECRET }}
        events:
          - push
        token: ${{ secrets.GITHUB_TOKEN }}

    # STEP 5a: Render the ArgoCD Application manifest + k8s Deployment/Service
    # into a fresh local folder. This is now the ONLY place k8s manifests
    # live — the developer's repo (app/ above) never sees them.
    - id: render-argocd-manifest
      name: Generate ArgoCD Application Registration Descriptor
      action: fetch:template
      input:
        url: https://github.com/IvayloB84/backstage-templates/tree/main/skeleton/spring-boot-4/gitops
        targetPath: "./argocd-apps/${{ parameters.artifactId }}"
        values:
          appName: ${{ parameters.artifactId }}
          name: ${{ parameters.artifactId }}
          owner: ${{ parameters.repoOwner }}
          port: ${{ parameters.port }}

    # STEP 5b: Submit a PR to the centralized GitOps repo.
    # sourcePath + targetPath are both set to "argocd-apps" explicitly —
    # sourcePath scopes what gets read from the workspace, targetPath pins
    # exactly where it lands in the target repo. Setting both removes any
    # ambiguity about the destination path (this is what caused the earlier
    # full-workspace dump into the repo root).
    - id: submit-gitops-pull-request
      name: Submit Cluster State Pull Request to ArgoCD Repository
      action: publish:github:pull-request
      input:
        repoUrl: "github.com?owner=${{ parameters.repoOwner }}&repo=ArgoCD-RootApps"
        branchName: "infra-onboard-${{ parameters.artifactId }}"
        title: "feat(argocd): onboard service tracking for ${{ parameters.artifactId }}"
        description: 'Automated platform PR registering application manifests under argocd-apps/${{ parameters.artifactId }}/.'
        sourcePath: argocd-apps
        targetPath: argocd-apps
        token: ${{ secrets.GITHUB_TOKEN }}

    # STEP 6: Register the new repository into the Backstage Catalog
    - id: register-catalog-entry
      name: Bind Resource to Software Platform Catalog
      action: catalog:register
      input:
        catalogInfoUrl: "https://github.com/${{ parameters.repoOwner }}/${{ parameters.artifactId }}/blob/main/catalog-info.yaml"

  output:
    links:
      - title: Go to App Source Repository
        url: ${{ steps['publish-github-repository'].output.remoteUrl }}
      - title: Review Infrastructure Sync PR (ArgoCD Tracker)
        url: ${{ steps['submit-gitops-pull-request'].output.remoteUrl }}