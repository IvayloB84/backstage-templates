apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: deactivate-component-template
  title: Deactivate Cluster Component
  description: Safely tears down active pipeline structures and cleans GitOps anchors
spec:
  owner: user:default/IvayloB84
  type: service
  
  parameters:
    # 📑 PAGE 1: Identify Target Component to Deactivate
    - title: Identify Target Component to Deactivate
      required:
        - repoName
        - repoOwner
      properties:
        repoName:
          title: Component Repository Name
          type: string
          description: Enter the exact lowercase name of the application folder to remove.
        repoOwner:
          title: Repository Owner
          type: string
          default: IvayloB84
          description: Your GitHub organization or personal profile username
          
    # ⚙️ PAGE 2: Corporate Safety Gate
    - title: Corporate Safety Gate
      required:
        - confirmDestruction
      properties:
        confirmDestruction:
          title: "Infrastructure Destruction Authorization"
          type: boolean
          default: false
      uiSchema:
        confirmDestruction:
          ui:widget: "checkbox"
          ui:description: |
            <span style="color: #d32f2f; font-weight: bold; font-size: 1.1em;">
               WARNING: I explicitly authorize the total destruction of this component repository and all its infrastructure pipelines. Checking this box is mandatory to proceed.
            </span>

  steps:
    # Step 0: CACHE BUSTER - Initialize task session token
    - id: generate-uuid
      name: Generating Unique Session Token
      action: debug:log
      input:
        message: "Deactivation session identifier instantiated for repo: ${{ parameters.repoName }}"

    # Step 1: Clone your central cluster configuration repository
    - id: fetch-gitops-root
      name: Fetch Central ArgoCD Root Apps Repository
      action: fetch:plain
      input:
        url: 'https://github.com/${{ parameters.repoOwner }}/ArgoCD-RootApps'

    # Step 2: Use the standard shell runner to execute native Git tree-destruction utilities
    - id: git-purge-execution
      name: Execute Pure Structural Git Directory Erasure
      action: backstage:shell:execute
      input:
        command: |
          git config --global user.name "Backstage Platform Automation"
          git config --global user.email "platform-engineering@localhost"
          
          git checkout -b purge/${{ parameters.repoName }}
          
          if [ -d "./argocd-apps/${{ parameters.repoName }}" ]; then
            git rm -rf ./argocd-apps/${{ parameters.repoName }}
            
            git commit -m "cleanup(gitops): permanently purge infrastructure folder for ${{ parameters.repoName }}"
            
            # FIXED: Syntax error removed. Replaced '@://github.com{{' with '@github.com/${{'
            git push https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ parameters.repoOwner }}/ArgoCD-RootApps.git purge/${{ parameters.repoName }} --force
          else
            echo "Target tracking layout directory was not discovered in this workspace scope."
            exit 1
          fi

    # Step 3: Wrap that newly pushed feature branch into a clean administrative Pull Request
    - id: create-pr
      name: Generate GitOps Deletion Pull Request
      action: publish:github:pull-request
      input:
        # FIXED: Changed from standard web URL to the mandatory Backstage query-string schema
        repoUrl: 'github.com/${{ parameters.repoOwner }}/ArgoCD-RootApps'
        token: ${{ secrets.GITHUB_TOKEN }}
        branchName: purge/${{ parameters.repoName }}
        title: "fix(gitops): purge infrastructure folder for ${{ parameters.repoName }}"
        description: |
          ### Automated Component Deletion Request
          This PR completely removes the configuration directory `./argocd-apps/${{ parameters.repoName }}/`.
          
          Expected Outcomes upon merging:
          * Argo CD auto-pruning triggers immediately.
          * Target pods, configurations, and folders are removed from the cluster.
        targetBranchName: main

  output:
    links:
      - title: Review Deletion Pull Request
        url: ${{ steps['create-pr'].output.remoteUrl }}