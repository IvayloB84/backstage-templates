apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: deactivate-component-template
  title: Deactivate Cluster Component
  description: Safely tears down active pipeline structures and cleans GitOps anchors
spec:
  owner: user:default/IvayloB84
  type: service
  
  parameters:
    - title: Identify Target Component to Deactivate
      required:
      - repoName
      - repoOwner
      properties:
        repoName:
          title: Component Repository Name
          type: string
          description: Enter the exact lowercase name of the application folder to remove.
        repoOwner:
          title: Repository Owner
          type: string
          default: IvayloB84
          description: Your GitHub organization or personal profile username
    - title: Corporate Safety Gate
      required:
        - confirmDestruction
      properties:
        confirmDestruction:
          # Keep the title plain here so Backstage maps the internal variable safely
          title: "Infrastructure Destruction Authorization"
          type: boolean
          default: false
      uiSchema:
        confirmDestruction:
          ui:widget: "checkbox"
          ui:description: |
            <span style="color: #d32f2f; font-weight: bold; font-size: 1.1em;">
               WARNING: I explicitly authorize the total destruction of this component repository and all its infrastructure pipelines. Checking this box is mandatory to proceed.
            </span>
  steps:
    # STEP 1: Fetch the Centralized GitOps Hub
    - id: fetch-gitops-root
      name: Pull Centralized ArgoCD Tracking Hub
      action: fetch:plain
      input:
        url: https://github.com/${{ parameters.repoOwner }}/ArgoCD-RootApps
        targetPATH: '.'

    # STEP 2: Delete the specific folder locally in the Backstage workspace
    - id: wipe-tracking-node
      name: Remove Registration Directory from Workspace
      action: fs:delete
      input:
        files:
          - ./argocd-apps/${{ parameters.repoName }}

    # STEP 3: Submit the PR containing the deletion
    - id: publish-cleanup-pr
      name: Submit Deactivation Pull Request for Admin Approval
      action: publish:github:pull-request
      input:
        repoUrl: 'github.com?repo=ArgoCD-RootApps&owner=${{ parameters.repoOwner }}'
        targetBranchName: 'main'
        branchName: "cleanup-remove-${{ parameters.repoName }}"
        title: "PR-PURGE: Remove ${{ parameters.repoName }} from Infrastructure"
        description: |
          ### Automated Infrastructure Lifecycle Request
          This Pull Request removes the ArgoCD tracking folder: `argocd-apps/${{ parameters.repoName }}`.
        sourcePath: '.'
        update: true

  output:
    links:
      - title: Review and Merge Deletion PR
        url: ${{ steps['publish-cleanup-pr'].output.remoteUrl }}

    # - id: publish-cleanup-pr
    #   name: Submit Deactivation Pull Request for Admin Approval
    #   action: publish:github:pull-request
    #   input:
    #     repoUrl: 'github.com?owner=IvayloB84&branch=cleanup-remove-${{ parameters.repoName }}&repo=ArgoCD-RootApps'  
    #     title: "SECURE DEACTIVATION REQUEST: Purge tracking manifolds for ${{ parameters.repoName }}"
    #     branchName: "cleanup-remove-${{ parameters.repoName }}"
    #     sourcePath: '.'
    #     description: |
    #       ### System Infrastructure Lifecycle Request
    #       This Pull Request was automatically generated by Backstage to request the formal deactivation of ${{ parameters.repoName }}.
          
    #       The live infrastructure remains 100% active and running on the cluster right now. 
    #       To reject this destruction request, simply close this Pull Request.
          
    #       Reviewer Actions Required:
    #       1. Verify this component should be decommissioned.
    #       2. Merge this PR into main to permanently delete the folder.
    #       3. ArgoCD will instantly catch the merge and prune the cluster pods automatically.