apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: deactivate-component-template
  title: Deactivate Cluster Component
  description: Safely tears down active pipeline structures and cleans GitOps anchors
spec:
  owner: user:default/IvayloB84
  type: service

  parameters:
    - title: Identify Target Component to Deactivate
      required:
        - repoName
        - repoOwner
      properties:
        repoName:
          title: Component Repository Name
          type: string
          description: Verify the active application component item to remove.
        repoOwner:
          title: Repository Owner
          type: string
          default: IvayloB84
          description: Your GitHub organization or personal profile username

    - title: Corporate Safety Gate
      required:
        - confirmDestruction
      properties:
        confirmDestruction:
          title: "Infrastructure Destruction Authorization"
          type: boolean
          default: false
          enum:
            - true
      uiSchema:
        confirmDestruction:
          ui:widget: "checkbox"
          ui:description: |
            ### ⚠️ WARNING
            I explicitly authorize the total destruction of this component repository and all its infrastructure pipelines. Checking this box is mandatory to proceed.

  steps:
    - id: fetch-gitops-repo
      name: Fetch Full GitOps Repository
      action: fetch:plain
      input:
        url: "https://github.com/${{ parameters.repoOwner }}/ArgoCD-RootApps"
        targetPath: './gitops-checkout'

    - id: delete-component-folder
      name: Delete Component Directory
      action: fs:delete
      input:
        files:
          - './gitops-checkout/argocd-apps/${{ parameters.repoName }}'

    - id: create-pr
      name: Generate GitOps Deletion Pull Request
      action: publish:github:pull-request
      input:
        repoUrl: 'github.com?repo=ArgoCD-RootApps&owner=${{ parameters.repoOwner }}'
        token: ${{ secrets.GITHUB_TOKEN }}
        branchName: purge/${{ parameters.repoName }}
        title: "fix(gitops): purge infrastructure files for ${{ parameters.repoName }}"
        sourcePath: gitops-checkout
        targetPath: '.'
        update: true
        description: |
          ### Automated Component Deletion Request
          Removes the entire `argocd-apps/${{ parameters.repoName }}/` directory,
          whatever files currently happen to be inside it.
        targetBranchName: main

    - id: lookup-catalog-item
      name: Retain Catalog Target Footprint
      action: catalog:fetch
      input:
        entityRefs:
          - "component:default/${{ parameters.repoName }}"

    - id: delete-catalog-location
      name: Purge Catalog Item from Backstage
      action: http:backstage:request
      input:
        method: DELETE
        # Bypasses the lookup step completely by building the exact URL-encoded path using parameters
        path: ${{ "/api/catalog/locations/by-type/url/https%3A%2F%2Fgithub.com%2F" + parameters.repoOwner + "%2F" + parameters.repoName + "%2Ftree%2Fmain%2Fcatalog-info.yaml" }}
        headers:
          Accept: application/json

  output:
    links:
      - title: Review Deletion Pull Request
        url: ${{ steps['create-pr'].output.remoteUrl }}