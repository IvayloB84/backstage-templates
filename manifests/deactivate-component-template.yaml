apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: deactivate-component-template
  title: Deactivate Cluster Component
  description: Safely tears down active pipeline structures and cleans GitOps anchors
spec:
  owner: user:default/IvayloB84
  type: service
  
  parameters:
    # 📑 PAGE 1: Identify Target Component to Deactivate
    - title: Identify Target Component to Deactivate
      required:
        - repoName
        - repoOwner
      properties:
        repoName:
          title: Component Repository Name
          type: string
          description: Enter the exact lowercase name of the application folder to remove.
        repoOwner:
          title: Repository Owner
          type: string
          default: IvayloB84
          description: Your GitHub organization or personal profile username
          
    # ⚙️ PAGE 2: Corporate Safety Gate
    - title: Corporate Safety Gate
      required:
        - confirmDestruction
      properties:
        confirmDestruction:
          title: "Infrastructure Destruction Authorization"
          type: boolean
          default: false
      uiSchema:
        confirmDestruction:
          ui:widget: "checkbox"
          ui:description: |
            <span style="color: #d32f2f; font-weight: bold; font-size: 1.1em;">
               WARNING: I explicitly authorize the total destruction of this component repository and all its infrastructure pipelines. Checking this box is mandatory to proceed.
            </span>

  steps:
    # Step 0: CACHE BUSTER - Initialize task session token
    - id: generate-uuid
      name: Generating Unique Session Token
      action: debug:log
      input:
        message: "Deactivation session identifier instantiated for repo: ${{ parameters.repoName }}"

    # Step 1: Securely clone the application's source repository codebase
    - id: fetch-app-source
      name: Fetch Application Codebase Repository
      action: fetch:plain
      input:
        url: 'https://github.com/${{ parameters.repoOwner }}/${{ parameters.repoName }}'

    # Step 2: Overwrite the active catalog-info.yaml file with a decommissioned footprint.
    - id: mark-deactivation
      name: Write Application Decommissioning Definition
      action: catalog:write
      input:
        filePath: './catalog-info.yaml'
        entity:
          apiVersion: backstage.io/v1alpha1
          kind: Component
          metadata:
            name: ${{ parameters.repoName }}
            description: "Freshly deactivated application."
            annotations:
              github.com/project-slug: "${{ parameters.repoOwner }}/${{ parameters.repoName }}"
              status: "deactivated-via-backstage-runbook"
          spec:
            type: service
            lifecycle: decommissioned
            owner: "user:default/${{ parameters.repoOwner }}"

    # Step 3: Open an Infrastructure Pull Request against the application repo to request teardown approval
    - id: create-pr
      name: Generate Application Deactivation Pull Request
      action: publish:github:pull-request
      input:
        repoUrl: 'github.com?repo=${{ parameters.repoName }}&owner=${{ parameters.repoOwner }}'
        token: ${{ secrets.GITHUB_TOKEN }}
        branchName: purge/${{ parameters.repoName }}
        title: "fix(lifecycle): decommission component anchors for ${{ parameters.repoName }}"
        description: |
          ### Automated Component Deactivation Request
          This PR modifies the `catalog-info.yaml` descriptor file to flag this repository as decommissioned.
          
          Expected Outcomes upon merging:
          * The 'argocd/app-name' label tag tracking link is stripped out.
          * The parent Application controller breaks synchronization, initiating a full live pod purge from the cluster.
        targetBranchName: main

  output:
    links:
      - title: Review Deletion Pull Request
        url: ${{ steps['create-pr'].output.remoteUrl }}