apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: deactivate-component-template
  title: Deactivate Cluster Component
  description: Safely tears down active pipeline structures and cleans GitOps anchors
spec:
  owner: user:default/IvayloB84
  type: service

  parameters:
    - title: Identify Target Component to Deactivate
      required:
        - repoName
        - repoOwner
      properties:
        repoName:
          title: Component Repository Name
          type: string
          description: Verify the active application component item to remove.
        repoOwner:
          title: Repository Owner
          type: string
          default: IvayloB84
          description: Your GitHub organization or personal profile username

      # Conditional logic dependencies block evaluated cleanly by the form builder engine
      dependencies:
        repoName:
          oneOf:
            - properties:
                repoName:
                  type: string
                  minLength: 1 # Triggers instantly if data lands via frontend redirection
              uiSchema:
                repoName:
                  ui:disabled: true # Turns input grey and locks editing immediately
            - properties:
                repoName:
                  type: string
                  maxLength: 0 # Fallback default matches direct user menu navigation

    # PAGE 2: Corporate Safety Gate
    - title: Corporate Safety Gate
      required:
        - confirmDestruction
      properties:
        confirmDestruction:
          title: "Infrastructure Destruction Authorization"
          type: boolean
          default: false
          enum:
            - true
      uiSchema:
        confirmDestruction:
          ui:widget: "checkbox"
          ui:description: |
            ### ⚠️ WARNING
            I explicitly authorize the total destruction of this component repository and all its infrastructure pipelines. Checking this box is mandatory to proceed.


  steps:
    - id: generate-uuid
      name: Generating Unique Session Token
      action: debug:log
      input:
        message: "Deactivation session identifier instantiated for repo: ${{ parameters.repoName }}"

    # STEP 1: Safely fetch the entity metadata using the built-in action
    - id: get-component
      name: Read Active Catalog Entry
      action: catalog:fetch
      input:
        entityRef: 'component:default/${{ parameters.repoName }}'

    # STEP 2: Issue a hard DELETE against the exact parent location target
    - id: purge-backstage-location
      name: Evict Location Anchor from Backstage Database
      action: http:backstage:request
      input:
        method: 'DELETE'
        path: '/catalog/entities/by-name/${{ steps["get-component"].output.entity.metadata.annotations["backstage.io/managed-by-location"] }}'

    - id: create-pr
      name: Generate GitOps Deletion Pull Request
      action: publish:github:pull-request
      input:
        repoUrl: 'github.com?repo=ArgoCD-RootApps&owner=${{ parameters.repoOwner }}'
        token: ${{ secrets.GITHUB_TOKEN }}
        branchName: purge/${{ parameters.repoName }}
        title: "fix(gitops): purge infrastructure files for ${{ parameters.repoName }}"
        update: true 
        filesToDelete:
          - 'argocd-apps/${{ parameters.repoName }}/argocd-app.yaml'
          - 'argocd-apps/${{ parameters.repoName }}/k8s/deployment.yaml'
          - 'argocd-apps/${{ parameters.repoName }}/k8s/service.yaml'
          - 'argocd-apps/${{ parameters.repoName }}/catalog-info.yaml'
          - 'argocd-apps/${{ parameters.repoName }}/index.html'
          - 'argocd-apps/${{ parameters.repoName }}/config.yaml'
          - 'argocd-apps/${{ parameters.repoName }}/nginx.conf'
          - 'argocd-apps/${{ parameters.repoName }}/httpd.conf'
        description: |
          ### Automated Component Deletion Request
          This PR cleanly removes the application and service manifests inside `./argocd-apps/${{ parameters.repoName }}/k8s/`.

          Expected Outcomes upon merging:
          * Argo CD auto-pruning triggers immediately.
          * Target pods, configurations, and folders are removed from the cluster.
        targetBranchName: main

  output:
    links:
      - title: Review Deletion Pull Request
        url: ${{ steps['create-pr'].output.remoteUrl }}