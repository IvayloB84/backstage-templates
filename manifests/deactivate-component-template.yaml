apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: deactivate-component-template
  title: Deactivate Cluster Component
  description: Safely tears down active pipeline structures and cleans GitOps anchors
spec:
  owner: user:default/IvayloB84
  type: service
  
  parameters:
    - title: Identify Target Component to Deactivate
      required:
      - repoName
      - repoOwner
      properties:
        repoName:
          title: Component Repository Name
          type: string
          description: Enter the exact lowercase name of the application folder to remove.
        repoOwner:
          title: Repository Owner
          type: string
          default: IvayloB84
          description: Your GitHub organization or personal profile username
    - title: Corporate Safety Gate      
      required:
        - confirmDestruction
      properties:
        confirmDestruction:
          title: "<html><span style='color: #d32f2f; font-weight: bold;'> I explicitly authorize the total destruction of this component repository and all its infrastructure pipelines</span></html>"
          type: boolean
          default: false
  steps:
    - id: fetch-gitops-root
      name: Pull Centralized ArgoCD Tracking Hub
      action: fetch:plain
      input:
        url: https://github.com/${{ parameters.repoOwner }}/ArgoCD-RootApps

    - id: inject-lifecycle-hold
      name: Inject Secure Infrastructure Deactivation Review Tag
      action: fs:createFile
      input:
        filePath: ./argocd-apps/${{ parameters.repoName }}/application.yaml
        content: |
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: ${{ parameters.repoName }}
            namespace: argocd
            annotations:
              # RECOVERY LOCK: Tells ArgoCD to intercept and request a foreground teardown ONLY upon admin merge
              argocd.argoproj.io/lifecycle-delete-policy: Foreground
          spec:
            project: default
            source:
              repoURL: "https://github.com/${{ parameters.repoOwner }}/ArgoCD-RootApps.git"
              targetRevision: main
              path: "argocd-apps/${{ parameters.repoName }}"
            destination:
              server: "https://kubernetes.default.svc"
              namespace: default

    - id: publish-cleanup-pr
      name: Submit Deactivation Pull Request for Admin Approval
      action: publish:github:pull-request
      input:
        repoUrl: 'github.com?repo=ArgoCD-RootApps&owner=${{ parameters.repoOwner }}'
        branchName: "cleanup-remove-${{ parameters.repoName }}"
        title: "SECURE DEACTIVATION REQUEST: Purge tracking manifolds for ${{ parameters.repoName }}"
        sourcePath: '.'
        description: |
          ### System Infrastructure Lifecycle Request
          This Pull Request was automatically generated by Backstage to request the formal deactivation of ${{ parameters.repoName }}.
          
          Reviewer Actions Required:
          1. Verify this component should be decommissioned.
          2. Merge this PR to trigger automated cluster pruning.
          3. Manually delete the standalone project codebase repo if applicable.