apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: github-repo-demo-template-v4
  title: Create GitHub Repository with GitOps Configs
  description: Automatically provisions a new codebase and seeds tracking manifests straight into ArgoCD.
spec:
  owner: user:default/IvayloB84
  type: service

  parameters:
    # 📑 PAGE 1: Repository Ownership Details
    - title: Provide Repository Information
      required:
        - repoName
        - repoOwner
      properties:
        repoName:
          title: Repository Name
          type: string
          maxLength: 50
          pattern: '^([a-z][a-z0-9]*)(-[a-z0-9]+)*$'
          description: Choose a unique name for your new code repository.
        repoOwner:
          title: Repository Owner
          type: string
          default: IvayloB84
          description: Your GitHub organization or personal profile username.
        description:
          title: Description
          type: string
          description: A brief summary explaining the purpose of this microservice.

    # ⚙️ PAGE 2: Service Selection & Dynamic Credentials (Fully Dynamic Context)
    - title: Advanced Service Configuration
      required:
        - serviceType
      properties:
        serviceType:
          title: Base Service Stack
          type: string
          enum: [nginx, postgres, java, redis]
          description: Select the container technology runtime for your environment.

      dependencies:
        serviceType:
          oneOf:
            # --- POSTGRES LOGIC ---
            - properties:
                serviceType: { enum: [postgres] }
                serviceImage: { type: string, default: "postgres:16-alpine" }
                servicePort: { type: integer, default: 5432 }
                dbUser: { type: string, default: postgres }
                dbPassword: { type: string, ui:field: Secret }
                dbName: { type: string, default: app_db }
              required: [serviceImage, servicePort, dbUser, dbPassword, dbName]

            # --- REDIS LOGIC ---
            - properties:
                serviceType: { enum: [redis] }
                serviceImage: { type: string, default: "redis:7-alpine" }
                servicePort: { type: integer, default: 6379 }
                redisPassword: { type: string, ui:field: Secret, default: "" }
              required: [serviceImage, servicePort]

            # --- JAVA LOGIC ---
            - properties:
                serviceType: { enum: [java] }
                serviceImage: { type: string, default: "eclipse-temurin:17-jre-alpine" }
                servicePort: { type: integer, default: 8080 }
                javaOpts: { type: string, default: "-Xms512m -Xmx1024m" }
                appEnv: { type: string, default: development, enum: [development, staging, production] }
              required: [serviceImage, servicePort, javaOpts, appEnv]

            # --- NGINX LOGIC ---
            - properties:
                serviceType: { enum: [nginx] }
                serviceImage: { type: string, default: "nginx:alpine" }
                servicePort: { type: integer, default: 80 }
                nginxMode: { type: string, default: standard-spa, enum: [standard-spa, reverse-proxy, static-assets] }
              required: [serviceImage, servicePort, nginxMode]

  steps:
    # 🎲 Step 0: CACHE BUSTER - Initialize task session token
    - id: generate-uuid
      name: Generating Unique Session Token
      action: debug:log
      input:
        message: "Session identifier instantiated for repo: ${{ parameters.repoName }}"

    # 📝 Step 1A: Render skeleton files into an isolated directory for the application codebase repository
    - id: fetch-skeleton-app
      name: Render Codebase Repository Skeleton
      action: fetch:template
      input:
        url: 'https://github.com/${{ parameters.repoOwner }}/backstage-templates/tree/main/skeleton'
        targetPath: '.'
        values:
          repoName: ${{ parameters.repoName }}
          repoOwner: ${{ parameters.repoOwner }}
          description: ${{ parameters.description or 'Freshly generated application.' }}
          image: ${{ parameters.serviceImage }}
          port: ${{ parameters.servicePort }}
          serviceType: ${{ parameters.serviceType }}
                 
          runCommand: ${{ (['sh', '-c'] if (parameters.serviceType == 'java' or parameters.serviceType == 'nginx') else []) | dump }}
          runArgs: ${{ (['echo Runtime container initialized. Waiting for code deployment... && sleep infinity'] if (parameters.serviceType == 'java' or parameters.serviceType == 'nginx') else []) | dump }}
          dbUser: ${{ parameters.dbUser or 'postgres' }}
          dbPassword: ${{ parameters.dbPassword or '' }}
          dbName: ${{ parameters.dbName or 'postgres' }}
          redisPassword: ${{ parameters.redisPassword or '' }}
          javaOpts: ${{ parameters.javaOpts or '' }}
          appEnv: ${{ parameters.appEnv or '' }}
          nginxMode: ${{ parameters.nginxMode or '' }}
          cpuRequest: ${{ parameters.cpuRequest or '25m' }}
          cpuLimit: ${{ parameters.cpuLimit or '150m' }}
          memRequest: ${{ parameters.memRequest or '16Mi' }}
          memLimit: ${{ parameters.memLimit or '32Mi' }}

    # 🚀 Step 2A: Publishes the isolated app folder safely to GitHub as a fresh repo
    - id: publish
      name: Provision Production Repository on GitHub and Stamp GitOps Topics
      action: publish:github
      input:
        repoUrl: 'github.com?repo=${{ parameters.repoName }}&owner=${{ parameters.repoOwner }}'
        repoVisibility: public
        token: ${{ secrets.GITHUB_TOKEN }}
        defaultBranch: 'main'
        sourcePath: '.'

        gitCommitMessage: "initial platform commit"
        gitAuthorName: "IvayloB84"
        gitAuthorEmail: "scaffolder@localhost"

    # 🔗 Step 2B: Instantly wire up your ngrok proxy link
    - id: create-webhook
      name: Link Developer Repo to ArgoCD Webhook
      action: github:webhook
      input:
        repoUrl: 'github.com?repo=${{ parameters.repoName }}&owner=${{ parameters.repoOwner }}'
        webhookUrl: 'https://reason-ricotta-clicker.ngrok-free.dev/api/webhook'
        contentType: 'json'
        events:
          - push
        token: ${{ secrets.GITHUB_TOKEN }}

    # 🚀 Step 3: Submits the completely un-cleared gitops folder payload tree to your central infrastructure repository
    - id: append-to-roster
      name: Submit Automated Deployment Manifest to Central GitOps Hub
      action: publish:github:pull-request
      input:
        repoUrl: 'github.com?repo=ArgoCD-RootApps&owner=${{ parameters.repoOwner }}'
        token: ${{ secrets.GITHUB_TOKEN }}
        branchName: 'infra/add-${{ parameters.repoName }}'      
        title: "infra: register new service ${{ parameters.repoName }}"
        description: "Automated configuration generation from the software scaffold portal."        
        sourcePath: '.'
        targetPath: 'argocd-apps/${{ parameters.repoName }}'

    # ⏳ Step 4: STATE SYNC - Wait for GitHub APIs to fully propagate
    - id: wait-for-github
      name: Synchronizing Cloud Repository State
      action: debug:wait
      input:
        seconds: 15

    # 📁 Step 5: REGISTER
    - id: register
      name: Register in Backstage Catalog
      action: catalog:register
      input:
        catalogInfoUrl: 'https://github.com/${{ parameters.repoOwner }}/${{ parameters.repoName }}/blob/main/catalog-info.yaml'

  output:
    links:
      - title: Open Fresh Repository on GitHub
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open Central GitOps Infrastructure PR
        url: ${{ steps['append-to-roster'].output.remoteUrl }}
      - title: Open Backstage Catalog Entity
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}