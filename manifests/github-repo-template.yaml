apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: github-repo-template
  title: Create a New GitHub Repository
  description: Scaffolds a baseline source code workspace with GitOps webhooks

spec:
  owner: "user:default/IvayloB84"
  type: service

  parameters:
    # --- PAGE 1: Repository Ownership Details ---
    - title: Provide Repository Information
      required:
        - repoName
        - repoOwner
      properties:
        repoName:
          title: Repository Name
          type: string
          maxLength: 50
          pattern: '^([a-z][a-z0-9]*)(-[a-z0-9]+)*$'
          description: Choose a unique name for your new code repository.
        repoOwner:
          title: Repository Owner
          type: string
          # Canonical Backstage session injector: dynamically pulls active profile username string
          default: ${{ user.entity.metadata.name }}
          description: Automatically assigned to your active authenticated GitHub identity profile.
        description:
          title: Description
          type: string
          description: A brief summary explaining the purpose of this microservice.

      # Modern Backstage UI schema rule tracking: now locks down flawlessly because it is a base string field
      uiSchema:
        repoOwner:
          ui:disabled: true
          ui:readonly: true

    # PAGE 2: Web Server Configuration Profile (Kept exactly as you wrote it)
    - title: Web Server Runtime Configuration
      required:
        - serviceCategory
        - serviceType
        - image
        - port
        - webServerMode
        - webRootPath
      properties:
        serviceCategory:
          title: Architecture Classification
          type: string
          default: "webserver"
          enum: ["webserver"]
          description: Fixed architectural scope ensuring native shared workspace volume mounts.
        serviceType:
          title: Web Server Engine
          type: string
          description: Select the technology stack container profile.
          enum:
            - nginx
            - httpd
            - caddy
        image:
          title: Base Container Image
          type: string
          default: "nginx:alpine"
          description: The remote registry image tracking tag.
        port:
          title: Container Port Allocation
          type: integer
          default: 80
          description: Internal port listener mapping configuration.
        webServerMode:
          title: Web Server Routing Profile
          type: string
          default: "standard-spa"
          description: Select the execution layer pattern for asset delivery.
          enum:
            - "standard-spa"
            - "reverse-proxy"
            - "static-assets"
        webRootPath:
          title: Container Document Root Path
          type: string
          default: "/usr/share/nginx/html"
          description: Absolute destination path where the engine reads code files.

      dependencies:
        serviceType:
          oneOf:
            - properties:
                serviceType: { const: "nginx" }
                image: { type: string, default: "nginx:alpine" }
                port: { type: integer, default: 80 }
                webRootPath: { type: string, default: "/usr/share/nginx/html" }
            - properties:
                serviceType: { const: "httpd" }
                image: { type: string, default: "httpd:alpine" }
                port: { type: integer, default: 80 }
                webRootPath: { type: string, default: "/usr/local/apache2/htdocs" }
            - properties:
                serviceType: { const: "caddy" }
                image: { type: string, default: "caddy:alpine" }
                port: { type: integer, default: 80 }
                webRootPath: { type: string, default: "/usr/share/caddy" }

  steps:
    # 🎲 Step 0: CACHE BUSTER - Initialize task session token
    - id: generate-uuid
      name: Generating Unique Session Token
      action: debug:log
      input:
        message: "Session identifier instantiated for repo: ${{ parameters.repoName }}"

    # 📝 Step 1: Dynamic Folder Fetch Switch
    - id: fetch-skeleton-app
      name: Render Codebase Repository Skeleton
      action: fetch:template
      input:
        # [FIXED STANDARD] Flat execution structure eliminates multi-line parsing errors entirely
        url: >-
          ${{ 'https://github.com/' ~ parameters.repoOwner ~ '/backstage-templates/tree/main/skeleton/proxy-nginx' if parameters.webServerMode == 'reverse-proxy' else ('https://github.com/' ~ parameters.repoOwner ~ '/backstage-templates/tree/main/skeleton/webservers-static' if parameters.webServerMode == 'static-assets' else 'https://github.com/' ~ parameters.repoOwner ~ '/backstage-templates/tree/main/skeleton/webservers-spa') }}
        targetPath: '.'
        values:
          repoName: ${{ parameters.repoName }}
          repoOwner: ${{ parameters.repoOwner }}
          description: ${{ parameters.description or 'Freshly generated web application.' }}
          
          # Dynamic server runtime parameters
          serviceCategory: ${{ parameters.serviceCategory }}
          serviceType: ${{ parameters.serviceType }}
          image: ${{ parameters.image }}
          port: ${{ parameters.port }}
          webServerMode: ${{ parameters.webServerMode }}
          webRootPath: ${{ parameters.webRootPath }}
                 
          # Dynamic execution layer commands
          runCommand: ${{ ([] if parameters.webServerMode == 'standard-spa' else ['sh', '-c']) | dump }}
          runArgs: ${{ ([] if parameters.webServerMode == 'standard-spa' else ['echo Initializing custom web routing profile...']) | dump }}

          # Resource allocation parameters
          cpuRequest: ${{ parameters.cpuRequest or '25m' }}
          cpuLimit: ${{ parameters.cpuLimit or '150m' }}
          memRequest: ${{ parameters.memRequest or '16Mi' }}
          memLimit: ${{ parameters.memLimit or '32Mi' }}


    # 🚀 Step 2A: Publishes the isolated app folder safely to GitHub as a fresh repo
    - id: publish
      name: Provision Production Repository on GitHub and Stamp GitOps Topics
      action: publish:github
      input:
        repoUrl: 'github.com?repo=${{ parameters.repoName }}&owner=${{ parameters.repoOwner }}'
        repoVisibility: public
        token: ${{ secrets.GITHUB_TOKEN }}
        defaultBranch: 'main'
        sourcePath: '.'

        gitCommitMessage: "initial platform commit"
        gitAuthorName: "IvayloB84"
        gitAuthorEmail: "scaffolder@localhost"

    # 🔗 Step 2B: Instantly wire up your permanent Smee.io link
    - id: create-webhook
      name: Link Developer Repo to ArgoCD Webhook
      action: github:webhook
      input:
        repoUrl: 'github.com?repo=${{ parameters.repoName }}&owner=${{ parameters.repoOwner }}'
        webhookUrl: 'https://smee.io/vVvKlKpQsKv5zv0W'
        contentType: 'json'
        events:
          - push
        token: ${{ secrets.GITHUB_TOKEN }}


    # 🚀 Step 3: Submits the completely un-cleared gitops folder payload tree to your central infrastructure repository
    - id: append-to-roster
      name: Submit Automated Deployment Manifest to Central GitOps Hub
      action: publish:github:pull-request
      input:
        repoUrl: 'github.com?repo=ArgoCD-RootApps&owner=${{ parameters.repoOwner }}'
        token: ${{ secrets.GITHUB_TOKEN }}
        branchName: 'infra/add-${{ parameters.repoName }}'      
        title: "infra: register new service ${{ parameters.repoName }}"
        description: "Automated configuration generation from the software scaffold portal."        
        sourcePath: '.'
        targetPath: 'argocd-apps/${{ parameters.repoName }}'

    # ⏳ Step 4: STATE SYNC - Wait for GitHub APIs to fully propagate
    - id: wait-for-github
      name: Synchronizing Cloud Repository State
      action: debug:wait
      input:
        seconds: 15

    # 📁 Step 5: REGISTER
    - id: register
      name: Register in Backstage Catalog
      action: catalog:register
      input:
        catalogInfoUrl: 'https://github.com/${{ parameters.repoOwner }}/${{ parameters.repoName }}/blob/main/catalog-info.yaml'

  output:
    links:
      - title: Open Fresh Repository on GitHub
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open Central GitOps Infrastructure PR
        url: ${{ steps['append-to-roster'].output.remoteUrl }}
      - title: Open Backstage Catalog Entity
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}