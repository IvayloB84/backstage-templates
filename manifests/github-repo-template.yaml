apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: github-repo-template
  title: Create a New GitHub Repository
  description: Scaffolds a baseline source code workspace with GitOps webhooks

spec:
  owner: "user:default/IvayloB84"
  type: service

  parameters:
    # 📑 PAGE 1: Provide Repository Information
    - title: Provide Repository Information
      required:
        - repoName
        - repoOwner
      properties:
        repoName:
          title: Repository Name
          type: string
          maxLength: 50
          pattern: '^([a-z][a-z0-9]*)(-[a-z0-9]+)*$'
          description: Choose a unique name for your new code repository.
        repoOwner:
          title: Repository Owner
          type: string
          default: IvayloB84
          description: Your GitHub organization or personal profile username.
        description:
          title: Description
          type: string
          description: A brief summary explaining the purpose of this microservice.

    # 📑 PAGE 2: Web Server Engine Selection
    - title: Web Server Runtime Configuration
      type: object
      anyOf:
        # 🟢 ENGINE OPTION A: Nginx
        - title: Nginx Web Server
          properties:
            serviceType:
              type: string
              enum: [nginx]
              default: nginx
              title: Web Server Engine
            image:
              title: Base Container Image
              type: string
              default: "nginx:alpine"
            port:
              title: Container Port Allocation
              type: integer
              default: 80
            webServerMode:
              title: Web Server Routing Profile
              type: string
              default: "standard-spa" # 🚀 THE FIX: Sets pre-selected option on initial load
              description: Select the execution layer pattern for asset delivery.
              enum:
                - "standard-spa"
                - "reverse-proxy"
                - "static-assets"
            webRootPath:
              title: Container Document Root Path
              type: string
              default: "/usr/share/nginx/html"
          required:
            - serviceType
            - image
            - port
            - webServerMode
            - webRootPath

        # 🔵 ENGINE OPTION B: Apache HTTPD
        - title: Apache HTTPD Server
          properties:
            serviceType:
              type: string
              enum: [httpd]
              default: httpd
              title: Web Server Engine
            image:
              title: Base Container Image
              type: string
              default: "httpd:alpine"
            port:
              title: Container Port Allocation
              type: integer
              default: 80
            webRootPath:
              title: Container Document Root Path
              type: string
              default: "/usr/local/apache2/htdocs"
          required:
            - serviceType
            - image
            - port
            - webRootPath

  steps:
    # 🎲 Step 0: CACHE BUSTER - Initialize task session token
    - id: generate-uuid
      name: Generating Unique Session Token
      action: debug:log
      input:
        message: "Session identifier instantiated for repo: ${{ parameters.repoName }}"

    # 📝 Step 1: Dynamic Folder Fetch Switch
    - id: fetch-skeleton-app
      name: Render Codebase Repository Skeleton
      action: fetch:template
      input:
        url: >-
          ${{ 'https://github.com/' ~ parameters.repoOwner ~ '/backstage-templates/tree/main/skeleton/webservers-httpd' if parameters.serviceType == 'httpd' else 
              ('https://github.com/' ~ parameters.repoOwner ~ '/backstage-templates/tree/main/skeleton/proxy-nginx' if (parameters.serviceType == 'nginx' and parameters.webServerMode == 'reverse-proxy') else 
               ('https://github.com/' ~ parameters.repoOwner ~ '/backstage-templates/tree/main/skeleton/webservers-static' if (parameters.serviceType == 'nginx' and parameters.webServerMode == 'static-assets') else 
                'https://github.com/' ~ parameters.repoOwner ~ '/backstage-templates/tree/main/skeleton/webservers-spa')) }}
        targetPath: '.'
        values:
          repoName: ${{ parameters.repoName }}
          repoOwner: ${{ parameters.repoOwner }}
          description: ${{ parameters.description or 'Freshly generated web application.' }}
          serviceType: ${{ parameters.serviceType }}
          
          # Cleaned uniform pipeline parameters mapping directly to shared fields
          image: ${{ parameters.image }}
          port: ${{ parameters.port }}
          webRootPath: ${{ parameters.webRootPath }}
          webServerMode: ${{ parameters.webServerMode or 'static-assets' }}
                 
          # Dynamic execution layer commands (SAFE CONDITIONS)
          runCommand: ${{ ([] if (parameters.serviceType == 'nginx' and parameters.webServerMode == 'standard-spa') else ['sh', '-c']) | dump }}
          runArgs: ${{ ([] if (parameters.serviceType == 'nginx' and parameters.webServerMode == 'standard-spa') else ['echo', 'Initializing custom web routing profile...']) | dump }}

          # Resource allocation parameters
          cpuRequest: ${{ parameters.cpuRequest or '50m' }}
          cpuLimit: ${{ parameters.cpuLimit or '300m' }}
          memRequest: ${{ parameters.memRequest or '32Mi' }}
          memLimit: ${{ parameters.memLimit or '64Mi' }}

    # 🚀 Step 2A: Publishes the isolated app folder safely to GitHub as a fresh repo
    - id: publish
      name: Provision Production Repository on GitHub and Stamp GitOps Topics
      action: publish:github
      input:
        repoUrl: 'github.com?repo=${{ parameters.repoName }}&owner=${{ parameters.repoOwner }}'
        repoVisibility: public
        token: ${{ secrets.GITHUB_TOKEN }}
        defaultBranch: 'main'
        sourcePath: '.'

        gitCommitMessage: "initial platform commit"
        gitAuthorName: "IvayloB84"
        gitAuthorEmail: "scaffolder@localhost"
        topics: ['backstage-managed']

    # 🔗 Step 2B: Instantly wire up your permanent Smee.io link
    - id: create-webhook
      name: Link Developer Repo to ArgoCD Webhook
      action: github:webhook
      input:
        repoUrl: 'github.com?repo=${{ parameters.repoName }}&owner=${{ parameters.repoOwner }}'
        webhookUrl: 'https://smee.io/vVvKlKpQsKv5zv0W'
        contentType: 'json'
        events:
          - push
        token: ${{ secrets.GITHUB_TOKEN }}


    # 🚀 Step 3: Submits the completely un-cleared gitops folder payload tree to your central infrastructure repository
    - id: append-to-roster
      name: Submit Automated Deployment Manifest to Central GitOps Hub
      action: publish:github:pull-request
      input:
        repoUrl: 'github.com?repo=ArgoCD-RootApps&owner=${{ parameters.repoOwner }}'
        token: ${{ secrets.GITHUB_TOKEN }}
        branchName: 'infra/add-${{ parameters.repoName }}'      
        title: "infra: register new service ${{ parameters.repoName }}"
        description: "Automated configuration generation from the software scaffold portal."        
        sourcePath: '.'
        targetPath: 'argocd-apps/${{ parameters.repoName }}'

    # ⏳ Step 4: STATE SYNC - Wait for GitHub APIs to fully propagate
    - id: wait-for-github
      name: Synchronizing Cloud Repository State
      action: debug:wait
      input:
        seconds: 15

    # # 📁 Step 5: REGISTER
    # - id: register
    #   name: Register in Backstage Catalog
    #   action: catalog:register
    #   input:
    #     catalogInfoUrl: 'https://github.com/${{ parameters.repoOwner }}/${{ parameters.repoName }}/blob/main/catalog-info.yaml'

  output:
    links:
      - title: Open Fresh Repository on GitHub
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open Central GitOps Infrastructure PR
        url: ${{ steps['append-to-roster'].output.remoteUrl }}
      - title: Open Backstage Catalog Entity
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}