apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: github-repo-demo-template-v4
  title: Create GitHub Repository with GitOps Configs
  description: Automatically provisions a new codebase and seeds tracking manifests straight into ArgoCD.
spec:
  owner: user:default/IvayloB84
  type: service

  parameters:
    - title: Provide Repository Information
      required:
        - repoName
        - repoOwner
        - serviceType
      properties:
        repoName:
          title: Repository Name
          type: string
          maxLength: 50
          pattern: '^([a-zA-Z][a-zA-Z0-9]*)(-[a-zA-Z0-9]+)*$'
        repoOwner:
          title: Repository Owner
          type: string
          default: IvayloB84
        description:
          title: Description
          type: string
        serviceType:
          title: Select Base Service Stack
          enum: [nginx, postgres, java, redis]
          enumNames: ['Nginx', 'PostgreSQL', 'Java', 'Redis']
        serviceImage:
          type: string
        servicePort:
          type: integer
        ownerNamespace:
          type: string
          default: 'user:default'
          ui:widget: hidden

      dependencies:
        serviceType:
          oneOf:
            - properties:
                serviceType: { enum: [nginx] }
                serviceImage: { type: string, default: "nginx:alpine" }
                servicePort: { type: integer, default: 80 }
              required: [serviceImage, servicePort]
            - properties:
                serviceType: { enum: [postgres] }
                serviceImage: { type: string, default: "postgres:16-alpine" }
                servicePort: { type: integer, default: 5432 }
              required: [serviceImage, servicePort]
            - properties:
                serviceType: { enum: [java] }
                serviceImage: { type: string, default: "eclipse-temurin:21-jre" }
                servicePort: { type: integer, default: 8080 }
              required: [serviceImage, servicePort]
            - properties:
                serviceType: { enum: [redis] }
                serviceImage: { type: string, default: "redis:alpine" }
                servicePort: { type: integer, default: 6379 }
              required: [serviceImage, servicePort]

  steps:
    # 🎲 Step 0: CACHE BUSTER - Initialize task session token
    - id: generate-uuid
      name: Generating Unique Session Token
      action: debug:log
      input:
        message: "Session identifier instantiated for repo: ${{ parameters.repoName }}"

    # 📝 Step 1A: Render skeleton files into an isolated directory for the application codebase repository
    - id: fetch-skeleton-app
      name: Render Codebase Repository Skeleton
      action: fetch:template
      input:
        url: 'https://github.com/${{ parameters.repoOwner }}/backstage-templates/tree/main/skeleton'
        targetPath: './app'
        values:
          repoName: ${{ parameters.repoName }}
          repoOwner: ${{ parameters.repoOwner }}
          description: ${{ parameters.description or 'Freshly generated application.' }}
          image: ${{ parameters.serviceImage }}
          port: ${{ parameters.servicePort }}
          ownerNamespace: ${{ parameters.ownerNamespace or 'user:default' }}

    # 📝 Step 1B: Render identical skeleton files into an isolated directory for the GitOps payload
    - id: fetch-skeleton-gitops
      name: Render Central Infrastructure GitOps Files
      action: fetch:template
      input:
        url: 'https://github.com/${{ parameters.repoOwner }}/backstage-templates/tree/main/skeleton'
        targetPath: './gitops'
        values:
          repoName: ${{ parameters.repoName }}
          repoOwner: ${{ parameters.repoOwner }}
          description: ${{ parameters.description or 'Freshly generated application.' }}
          image: ${{ parameters.serviceImage }}
          port: ${{ parameters.servicePort }}
          ownerNamespace: ${{ parameters.ownerNamespace or 'user:default' }}

    # 🚀 Step 2: Publishes the isolated app folder safely to GitHub as a fresh repo
    - id: publish
      name: Provision Production Repository on GitHub and Stamp GitOps Topics
      action: publish:github
      input:
        repoUrl: 'github.com?repo=${{ parameters.repoName }}&owner=${{ parameters.repoOwner }}'
        repoVisibility: public
        token: ${{ secrets.GITHUB_TOKEN }}
        defaultBranch: 'main'
        sourcePath: './app'

    # 🚀 Step 3: Submits the completely un-cleared gitops folder payload tree to your central infrastructure repository
    - id: append-to-roster
      name: Submit Automated Deployment Manifest to Central GitOps Hub
      action: publish:github:pull-request
      input:
        repoUrl: 'github.com?repo=ArgoCD-RootApps&owner=${{ parameters.repoOwner }}'
        token: ${{ secrets.GITHUB_TOKEN }}
        branchName: 'infra/add-${{ parameters.repoName }}'      
        title: "infra: register new service ${{ parameters.repoName }}"
        description: "Automated configuration generation from the software scaffold portal."        
        sourcePath: './gitops'
        targetPath: 'argocd-apps/${{ parameters.repoName }}'

    # ⏳ Step 4: STATE SYNC - Wait for GitHub APIs to fully propagate
    - id: wait-for-github
      name: Synchronizing Cloud Repository State
      action: debug:wait
      input:
        seconds: 15

    # 📁 Step 5: REGISTER
    - id: register
      name: Register in Backstage Catalog
      action: catalog:register
      input:
        catalogInfoUrl: 'https://github.com/${{ parameters.repoOwner }}/${{ parameters.repoName }}/blob/main/catalog-info.yaml'

  output:
    links:
      - title: Open Fresh Repository on GitHub
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open Central GitOps Infrastructure PR
        url: ${{ steps['append-to-roster'].output.remoteUrl }}
      - title: Open Backstage Catalog Entity
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}