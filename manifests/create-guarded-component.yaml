apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-guarded-component
  title: Generate Component with Resource Limits
  description: Provisions an app codebase repo with specialized container defaults and pushes distinct ArgoCD mapping configs to argocd-apps.
spec:
  owner: user:default/IvayloB84
  type: service

  parameters:
    - title: Dynamic Component Specifications
      required:
        - repoName
        - repoOwner
        - sizeProfile
        - serviceType
      properties:
        repoName:
          title: Component or Repository Name
          type: string
          description: Example, vector-mesh-router
        repoOwner:
          title: GitHub Owner/Organization
          type: string
          description: Your GitHub username or organization name.
          ui:field: OwnerPicker
          default: "IvayloB84"
        sizeProfile:
          title: Cluster Resource Allocation Profile
          type: string
          enum:
            - tiny
            - standard
            - large
          enumNames:
            - "Tiny Node (CPU: 250m, Mem: 256Mi)"
            - "Standard Node (CPU: 500m, Mem: 512Mi)"
            - "Large Node (CPU: 1000m, Mem: 1Gi)"
          default: standard
    - title: Target Application Stack Configuration
      required:
        - serviceType
      properties:
        serviceType:
          title: Select Application Stack
          type: string
          enum:
            - nginx
            - postgres
            - java
            - redis
          enumNames:
            - "NGINX Web Server"
            - "PostgreSQL Database"
            - "Java Runtime (OpenJDK 21)"
            - "Redis Cache Cluster"
          default: nginx
      dependencies:
        serviceType:
          oneOf:
            - properties:
                serviceType:
                  enum:
                    - nginx
                serviceImage:
                  title: Target Container Image
                  type: string
                  default: "nginx:alpine"
                servicePort:
                  title: Target Container Port
                  type: integer
                  default: 80
            - properties:
                serviceType:
                  enum:
                    - postgres
                serviceImage:
                  title: Target Container Image
                  type: string
                  default: "postgres:16-alpine"
                servicePort:
                  title: Target Container Port
                  type: integer
                  default: 5432
            - properties:
                serviceType:
                  enum:
                    - java
                serviceImage:
                  title: Target Container Image
                  type: string
                  default: "eclipse-temurin:21-jre"
                servicePort:
                  title: Target Container Port
                  type: integer
                  default: 8080
            - properties:
                serviceType:
                  enum:
                    - redis
                serviceImage:
                  title: Target Container Image
                  type: string
                  default: "redis:alpine"
                servicePort:
                  title: Target Container Port
                  type: integer
                  default: 6379
  steps:
    # --- PHASE 1: GENERATE & PUBLISH NEW APPLICATION REPOSITORY ---
    - id: fetch-app-skeleton
      name: Render Dynamic Codebase Files
      action: fetch:template
      input:
        url: ../skeleton
        targetPath: ./app-repo
        values:
          repoName: ${{ parameters.repoName }}
          repoOwner: ${{ parameters.repoOwner }}
          description: ${{ parameters.description or 'Freshly generated application.' }}
          image: ${{ parameters.serviceImage }}
          port: ${{ parameters.servicePort }}

    - id: merge-resource-limits
      name: Apply Selected Resource Profile Limits
      action: roadiehq:utils:merge
      input:
        path: "app-repo/k8s/base-deployment.yaml"
        content:
          spec:
            template:
              spec:
                containers:
                  - name: application
                    resources:
                      limits:
                        cpu: ${{ '1000m' if parameters.sizeProfile == 'large' else ('500m' if parameters.sizeProfile == 'standard' else '250m') }}
                        memory: ${{ '1Gi' if parameters.sizeProfile == 'large' else ('512Mi' if parameters.sizeProfile == 'standard' else '256Mi') }}
                      requests:
                        cpu: "100m"
                        memory: "128Mi"

    - id: publish-new-repo
      name: Spin Up Brand-New GitHub Repository
      action: publish:github
      input:
        allowedHosts:
          - github.com
        repoUrl: "https://github.com/${{ parameters.repoOwner }}/${{ parameters.repoName }}"
        sourcePath: ./app-repo
        description: "Application codebase repository for ${{ parameters.repoName }} created by Backstage."

    # --- PHASE 2: GENERATE ARGOCD APPLICATION MANIFEST FOR THE CENTRAL INFRA PR ---
    - id: create-argocd-manifest
      name: Construct ArgoCD App Configuration Mapping
      action: fetch:template
      input:
        url: ../skeleton
        targetPath: ./argocd-mapping
        values:
          repoName: ${{ parameters.repoName }}
          repoOwner: ${{ parameters.repoOwner }}
          image: ${{ parameters.serviceImage }}
          port: ${{ parameters.servicePort }}

    - id: push-to-infra-root
      name: Submit Automated GitOps Infrastructure Mapping
      action: publish:github:pull-request
      input:
        repoUrl: "https://github.com/${{ parameters.repoOwner }}/ArgoCD-RootApps"
        branchName: "infra/add-${{ parameters.repoName }}"
        sourcePath: ./argocd-mapping/k8s
        targetPath: "argocd-apps/${{ parameters.repoName }}"
        title: "chore(gitops): map dynamic application metadata for ${{ parameters.repoName }}"
        description: "Automated declaration registering the target repository with ArgoCD Root Application structures."

  output:
    links:
      - title: Open Fresh Repository on GitHub
        url: ${{ steps['publish-new-repo'].output.remoteUrl }}
      - title: Open Central GitOps Infrastructure PR
        url: ${{ steps['push-to-infra-root'].output.remoteUrl }}
      - title: Open Backstage Catalog Entity
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}