apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-guarded-component
  title: Generate Component with Resource Limits
  description: Provisions an app codebase repo with specialized container defaults and pushes distinct ArgoCD mapping configs to argocd-apps.
spec:
  owner: user:default/IvayloB84
  type: service

  parameters:
    - title: Step 1 - Component Profile Specifications
      required:
        - repoName
        - repoOwner
        - sizeProfile
        - serviceType

      properties:
        repoName:
          title: Component or Repository Name
          type: string
          description: Example, vector-mesh-router
        repoOwner:
          title: GitHub Owner/Organization
          type: string
          description: Your GitHub username or organization name.
          ui:field: OwnerPicker
          default: "IvayloB84"
        sizeProfile:
          title: Cluster Resource Allocation Profile
          type: string
          enum:
            - tiny
            - standard
            - large
          enumNames:
            - "Tiny Node (CPU: 250m, Mem: 256Mi)"
            - "Standard Node (CPU: 500m, Mem: 512Mi)"
            - "Large Node (CPU: 1000m, Mem: 1Gi)"
          default: standard
          
        serviceType:
          title: Select Base Service Stack
          enum: [nginx, postgres, java, redis]
          enumNames: ['Nginx', 'PostgreSQL', 'Java', 'Redis']
        serviceImage:
          type: string
        servicePort:
          type: integer
        ownerNamespace:
          type: string
          default: 'user:default'
          ui:widget: hidden

      dependencies:
        serviceType:
          oneOf:
            - properties:
                serviceType: { enum: [nginx] }
                serviceImage: { type: string, default: "nginx:alpine" }
                servicePort: { type: integer, default: 80 }
              required: [serviceImage, servicePort]
            - properties:
                serviceType: { enum: [postgres] }
                serviceImage: { type: string, default: "postgres:16-alpine" }
                servicePort: { type: integer, default: 5432 }
              required: [serviceImage, servicePort]
            - properties:
                serviceType: { enum: [java] }
                serviceImage: { type: string, default: "eclipse-temurin:21-jre" }
                servicePort: { type: integer, default: 8080 }
              required: [serviceImage, servicePort]
            - properties:
                serviceType: { enum: [redis] }
                serviceImage: { type: string, default: "redis:alpine" }
                servicePort: { type: integer, default: 6379 }
              required: [serviceImage, servicePort]

  steps:
    # --- PHASE 1: GENERATE & PUBLISH NEW APPLICATION REPOSITORY ---
    - id: fetch-app-skeleton
      name: Render Dynamic Codebase Files
      action: fetch:template
      input:
        url: ../skeleton
        targetPath: ./app-repo
        values:
          repoName: ${{ parameters.repoName }}
          repoOwner: ${{ parameters.repoOwner }}
          description: ${{ parameters.description or 'Freshly generated application.' }}
          image: ${{ parameters.serviceImage }}
          port: ${{ parameters.servicePort }}

    - id: merge-resource-limits
      name: Apply Selected Resource Profile Limits
      action: roadiehq:utils:merge
      input:
        path: "app-repo/k8s/base-deployment.yaml"
        content:
          spec:
            template:
              spec:
                containers:
                  - name: app-container
                    image: ${{ parameters.serviceImage }}
                    ports:
                      - containerPort: ${{ parameters.servicePort }}
                    env:
                      - name: POSTGRES_HOST_AUTH_METHOD
                        value: "trust"
                    resources:
                      limits:
                        cpu: ${{ '1000m' if parameters.sizeProfile == 'large' else ('500m' if parameters.sizeProfile == 'standard' else '250m') }}
                        memory: ${{ '1Gi' if parameters.sizeProfile == 'large' else ('512Mi' if parameters.sizeProfile == 'standard' else '256Mi') }}
                      requests:
                        cpu: "100m"
                        memory: "128Mi"

    - id: publish-new-repo
      name: Spin Up Brand-New GitHub Repository
      action: publish:github
      input:
        repoUrl: 'github.com?repo=${{ parameters.repoName }}&owner=${{ parameters.repoOwner }}'
        repoVisibility: public
        token: ${{ secrets.GITHUB_TOKEN }}
        sourcePath: './app-repo' # 🌟 FIXED: Publishes the rendered app files cleanly into the root of the new GitHub repo
        description: "Application codebase repository for ${{ parameters.repoName }} created by Backstage."

    # Step 2B: Instantly wire up your ngrok proxy link
    - id: create-webhook
      name: Link Developer Repo to ArgoCD Webhook
      action: github:webhook
      input:
        repoUrl: 'github.com?repo=${{ parameters.repoName }}&owner=${{ parameters.repoOwner }}'
        webhookUrl: 'https://reason-ricotta-clicker.ngrok-free.dev/api/webhook'
        contentType: 'json'
        events:
          - push
        token: ${{ secrets.GITHUB_TOKEN }}

    # Step 3: Submits the completely un-cleared gitops folder payload tree to your central infrastructure repository
    - id: append-to-roster
      name: Submit Automated Deployment Manifest to Central GitOps Hub
      action: publish:github:pull-request
      input:
        repoUrl: 'github.com?repo=ArgoCD-RootApps&owner=${{ parameters.repoOwner }}'
        token: ${{ secrets.GITHUB_TOKEN }}
        branchName: 'infra/add-${{ parameters.repoName }}'      
        title: "infra: register new service ${{ parameters.repoName }}"
        description: "Automated configuration generation from the software scaffold portal using strict Roadie object merge guardrails."        
        sourcePath: './app-repo/k8s' # 🌟 FIXED: Targets the active manifest folder location in your scratchpad
        targetPath: 'argocd-apps/${{ parameters.repoName }}'

    # Step 4: STATE SYNC - Wait for GitHub APIs to fully propagate
    - id: wait-for-github
      name: Synchronizing Cloud Repository State
      action: debug:wait
      input:
        seconds: 15

    # Step 5: REGISTER
    - id: register
      name: Register in Backstage Catalog
      action: catalog:register
      input:
        catalogInfoUrl: 'https://github.com/${{ parameters.repoOwner }}/${{ parameters.repoName }}/blob/main/catalog-info.yaml' # 🌟 FIXED: Now cleanly accessible at the root of the main branch

  output:
    links:
      - title: Open Fresh Repository on GitHub
        url: ${{ steps['publish-new-repo'].output.remoteUrl }} # 🌟 FIXED: References the exact action id used in the pipeline
      - title: Open Central GitOps Infrastructure PR
        url: ${{ steps['append-to-roster'].output.remoteUrl }}
      - title: Open Backstage Catalog Entity
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}