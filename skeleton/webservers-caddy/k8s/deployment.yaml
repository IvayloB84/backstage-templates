apiVersion: apps/v1
kind: Deployment
metadata:
  name: "${{ values.repoName }}"
  labels:
    app: "${{ values.repoName }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "${{ values.repoName }}"
  template:
    metadata:
      labels:
        app: "${{ values.repoName }}"
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        # 1. Web Server Engine Application Core Runtime Layer
        - name: app-container
          image: "${{ values.image }}"
          ports:
            - containerPort: ${{ values.port }}
          env:
            - name: "${{ values.serviceType | upper }}_PORT"
              value: "${{ values.port }}"
            # Caddy uses these environmental variable structures for its operational caching
            - name: XDG_DATA_HOME
              value: /tmp/caddy_data
            - name: XDG_CONFIG_HOME
              value: /tmp/caddy_config
          volumeMounts:
            - name: code-stream-volume
              mountPath: "${{ values.webRootPath }}"
            - name: config-volume
              mountPath: "/etc/caddy/Caddyfile"
              subPath: "Caddyfile"
          resources:
            requests:
              cpu: "${{ values.cpuRequest }}"
              memory: "${{ values.memRequest }}"
            limits:
              cpu: "${{ values.cpuLimit }}"
              memory: "${{ values.memLimit }}"

        # 2. Automated Git-Sync Synchronization Engine Layer
        - name: git-sync-sidecar
          image: "registry.k8s.io/git-sync/git-sync:v4.7.1"
          args:
            - "--repo=https://github.com/${{ values.repoOwner }}/${{ values.repoName }}.git"
            - "--branch=main"
            - "--depth=1"
            - "--wait=10"
            - "--root=/tmp/git"
            - "--dest=${{ values.repoName }}"
          volumeMounts:
            - name: code-stream-volume
              mountPath: /tmp/git
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"

      volumes:
        - name: code-stream-volume
          emptyDir: {}
        - name: config-volume
          configMap:
            name: "${{ values.repoName }}-caddy-config"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "${{ values.repoName }}-caddy-config"
data:
  Caddyfile: |
    :${{ values.port }} {
        root * ${{ values.webRootPath }}/${{ values.repoName }}
        file_server
        
        # Native SPA Fallback Engine Integration
        try_files {path} {path}/ /index.html
        
        log {
            output stdout
            format console
        }
    }