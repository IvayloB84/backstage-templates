apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.repoName }}-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ${{ values.repoName }}
  template:
    metadata:
      labels:
        app: ${{ values.repoName }}
    spec:
      containers:
        - name: app-container
          image: ${{ values.image }}
          ports:
            - containerPort: ${{ values.port }}
          resources: {} 
