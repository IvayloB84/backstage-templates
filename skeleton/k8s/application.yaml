apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "${{ values.repoName | lower }}"
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/${{ values.repoOwner }}/ArgoCD-RootApps.git"
    targetRevision: main
    path: "argocd-apps/${{ values.repoName }}/k8s"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
