apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "${{ values.repoName | lower }}"
  # LOCK IN: Kept in argocd namespace so your parent app-of-apps tracks it
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/${{ values.repoOwner }}/${{ values.repoName }}.git"
    targetRevision: "infra/add-${{ values.repoName }}"
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    # LANDING ZONE: Where your actual app code pod runs inside the cluster
    namespace: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
        - CreateNamespace=true
        - ApplyOutOfSyncOnly=true