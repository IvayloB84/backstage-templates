apiVersion: apps/v1
kind: Deployment
metadata:
  name: "${{ values.repoName }}"
  labels:
    app: "${{ values.repoName }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "${{ values.repoName }}"
  template:
    metadata:
      labels:
        app: "${{ values.repoName }}"
    spec:
      containers:
        - name: app-container
          image: "${{ values.image }}"
          ports:
            - containerPort: ${{ values.port }}
          command: ${{ values.runCommand }}
          args: ${{ values.runArgs }}
          resources:
            requests:
              cpu: "${{ values.cpuRequest }}"
              memory: "${{ values.memRequest }}"
            limits:
              cpu: "${{ values.cpuLimit }}"
              memory: "${{ values.memLimit }}"
          env:
            - name: SERVICE_TYPE
              value: "${{ values.serviceType }}"
            - name: POSTGRES_USER
              value: "${{ values.dbUser }}"
            - name: POSTGRES_PASSWORD
              value: "${{ values.dbPassword }}"
            - name: POSTGRES_DB
              value: "${{ values.dbName }}"
            - name: REDIS_PASSWORD
              value: "${{ values.redisPassword }}"
            - name: JAVA_OPTS
              value: "${{ values.javaOpts }}"
            - name: APP_ENV
              value: "${{ values.appEnv }}"
            - name: NGINX_ROUTING_PROFILE
              value: "${{ values.nginxMode }}"

---
apiVersion: v1
kind: Service
metadata:
  name: "${{ values.repoName }}"
  labels:
    app: "${{ values.repoName }}"
spec:
  ports:
    - port: ${{ values.port }}
      targetPort: ${{ values.port }}
  selector:
    app: "${{ values.repoName }}"