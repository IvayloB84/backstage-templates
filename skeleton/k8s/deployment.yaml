apiVersion: apps/v1
kind: Deployment
metadata:
  name: "${{ values.repoName }}"
  labels:
    app: "${{ values.repoName }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "${{ values.repoName }}"
  template:
    metadata:
      labels:
        app: "${{ values.repoName }}"
    spec:
      containers:
        # 1. Core Service Application Runtime (Generic Context)
        - name: app-container
          image: "${{ values.image }}"
          ports:
            - containerPort: ${{ values.port }}
          command: ${{ values.runCommand }}
          args: ${{ values.runArgs }}
          volumeMounts:
            - name: code-stream-volume
              mountPath: "${{ values.webRootPath | default('/usr/share/nginx/html') }}"
          resources:
            requests:
              cpu: "${{ values.cpuRequest }}"
              memory: "${{ values.memRequest }}"
            limits:
              cpu: "${{ values.cpuLimit }}"
              memory: "${{ values.memLimit }}"
          env:
            - name: SERVICE_TYPE
              value: "${{ values.serviceType }}"
            - name: WEB_SERVER_ROUTING_PROFILE
              value: "${{ values.webServerMode }}"

        # 2. Automated Git-Sync Core Engine (Upgraded to v4.7.1)
        - name: git-sync-sidecar
          image: "registry.k8s.io/git-sync/git-sync:v4.7.1"
          args:
            - "--repo=https://github.com/${{ values.repoOwner | default('IvayloB84') }}/${{ values.repoName }}.git"
            - "--branch=main"
            - "--depth=1"
            - "--wait=10"
            - "--root=/tmp/git"
          volumeMounts:
            - name: code-stream-volume
              mountPath: /tmp/git
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534

      # Shared internal workspace volume declaration connecting the containers
      volumes:
        - name: code-stream-volume
          emptyDir: {}