apiVersion: apps/v1
kind: Deployment
metadata:
  name: "${{ values.repoName }}"
  labels:
    app: "${{ values.repoName }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "${{ values.repoName }}"
  template:
    metadata:
      labels:
        app: "${{ values.repoName }}"
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        # 1. Web Server Engine Application Core Runtime Layer
        - name: app-container
          image: "${{ values.image }}"
          ports:
            - containerPort: ${{ values.port }}
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
          volumeMounts:
            - name: code-stream-volume
              mountPath: "${{ values.webRootPath }}"
            - name: config-volume
              mountPath: "/etc/nginx/conf.d/default.conf"
              subPath: "default.conf"
          resources:
            requests:
              cpu: "${{ values.cpuRequest }}"
              memory: "${{ values.memRequest }}"
            limits:
              cpu: "${{ values.cpuLimit }}"
              memory: "${{ values.memLimit }}"

        # 2. Automated Git-Sync Synchronization Engine Layer
        - name: git-sync-sidecar
          image: "registry.k8s.io/git-sync/git-sync:v4.7.1"
          args:
            - "--repo=https://github.com/${{ values.repoOwner }}/${{ values.repoName }}.git"
            - "--branch=main"
            - "--depth=1"
            - "--wait=10"
            - "--root=/tmp/git"
            - "--dest=${{ values.repoName }}"
          volumeMounts:
            - name: code-stream-volume
              mountPath: /tmp/git
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"

      volumes:
        - name: code-stream-volume
          emptyDir: {}
        - name: config-volume
          configMap:
            name: "${{ values.repoName }}-nginx-config"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "${{ values.repoName }}-nginx-config"
data:
  default.conf: |
    server {
        listen       ${{ values.port }};
        listen  [::]:${{ values.port }};
        server_name  localhost;

        location / {
            root ${{ values.webRootPath }}/${{ values.repoName }};
            autoindex on;
            try_files \$uri \$uri/ @spa;
        }

        location @spa {
            root ${{ values.webRootPath }}/${{ values.repoName }};
            try_files /index.html =404;
        }
    }