apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.name }}
  labels:
    app: ${{ values.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${{ values.name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ${{ values.name }}
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: ${{ values.name }}
          image: ghcr.io/${{ values.owner | lower }}/${{ values.name | lower }}:latest
          env:
            - name: SERVER_PORT
              value: "${{ values.port }}"
          ports:
            - name: http
              containerPort: ${{ values.port }}
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          startupProbe:
            tcpSocket:
              port: ${{ values.port }}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: ${{ values.port }}
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: ${{ values.port }}
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
      terminationGracePeriodSeconds: 60