name: Build and Push Container Image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A single recent JDK can compile+package for either Java 17 or 21
      # targets (Maven's release flag in pom.xml, set by Initializr, handles
      # the actual target version) — so this doesn't need to be templated.
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Actor and Token
        run: |
          echo "The github.actor is: ${{ github.actor }}"
          
          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "❌ ERROR: GITHUB_TOKEN is completely EMPTY or not passed!"
          else
            echo "✅ GITHUB_TOKEN is present."
            echo "Token character count: $(echo -n '${{ secrets.GITHUB_TOKEN }}' | wc -c)"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires a lowercase image path; github.repository preserves
      # the repo's actual casing, so normalize it first.
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
