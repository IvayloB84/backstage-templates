apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: "Freshly generated application."
  description: "${{ values.description }}"
  annotations:
    github.com/project-slug: "${{ values.repoOwner }}/${{ values.repoName }}"
    argocd/app-name: "${{ values.repoName }}"
    backstage.io/kubernetes-label-selector: "app=${{ values.repoName }}"
spec:
  type: service
  lifecycle: experimental
  owner: "user:default/${{ values.repoOwner }}"