apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.repoName | lower }}
  description: "${{ values.description }}"
  links:
    # FIX: Corrected internal api routing target port to 7007
    - url: https://localhost:7007/create/templates/default/deactivate-service-pipeline?template_args[repoName]=${{ values.repoName | lower }}
      title: Request Component Deactivation
      icon: help
spec:
  type: service
  lifecycle: experimental
  owner: ${{ values.repoOwner }}