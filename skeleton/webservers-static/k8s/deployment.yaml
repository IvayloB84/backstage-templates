apiVersion: apps/v1
kind: Deployment
metadata:
  name: "${{ values.repoName }}-static"
  labels:
    app: "${{ values.repoName }}-static"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "${{ values.repoName }}-static"
  template:
    metadata:
      labels:
        app: "${{ values.repoName }}-static"
    spec:
      securityContext:
        fsGroup: 65534
      initContainers:
        - name: wait-for-gitsync
          image: busybox:1.38
          command: ["/bin/sh", "-c"]
          args:
            - |
              while [ ! -d "${{ values.webRootPath }}/${{ values.repoName }}" ]; do
                echo "Waiting for git-sync directory..."
                sleep 2
              done

      containers:
        # 1. Unprivileged Traditional Asset Server Layer
        - name: static-container
          image: "${{ values.image }}"
          ports:
            - containerPort: ${{ values.port }}
          env:
            - name: "${{ values.serviceType | upper }}_PORT"
              value: "${{ values.port }}"
          volumeMounts:
            - name: code-stream-volume
              mountPath: "${{ values.webRootPath }}"
            - name: config-volume
              mountPath: "/etc/nginx/conf.d/default.conf"
              subPath: "default.conf"
            - name: tmp-fs
              mountPath: /tmp
            - name: var-cache
              mountPath: /var/cache/nginx
            - name: var-run
              mountPath: /var/run
          resources:
            requests:
              cpu: "${{ values.cpuRequest }}"
              memory: "${{ values.memRequest }}"
            limits:
              cpu: "${{ values.cpuLimit }}"
              memory: "${{ values.memLimit }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 101
            runAsGroup: 101

        # 2. Automated Git-Sync Synchronization Sidecar Engine Layer
        - name: git-sync-sidecar
          image: "registry.k8s.io/git-sync/git-sync:v4.7.1"
          args:
            - "--repo=https://github.com/${{ values.repoOwner }}/${{ values.repoName }}.git"
            - "--ref=main"
            - "--depth=1"
            - "--period=10s"
            - "--root=/tmp/git"
            - "--link=${{ values.repoName }}"
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: code-stream-volume
              mountPath: /tmp/git
            - name: tmp-fs
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 65534
            runAsGroup: 65534
          resources:
            requests:
              cpu: "${{ values.cpuRequest }}"
              memory: "${{ values.memRequest }}"
            limits:
              cpu: "${{ values.cpuLimit }}"
              memory: "${{ values.memLimit }}"

      volumes:
        - name: code-stream-volume
          emptyDir: {}
        - name: tmp-fs
          emptyDir: {}
        - name: var-cache
          emptyDir: {}
        - name: var-run
          emptyDir: {}
        - name: config-volume
          configMap:
            name: "${{ values.repoName }}-static-config"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "${{ values.repoName }}-static-config"
data:
  default.conf: |
    server {
        listen       ${{ values.port }};
        listen  [::]:${{ values.port }};
        server_name  localhost;

        location /healthz {
            return 200 "healthy\n";
        }

        # Traditional Asset Server Configuration
        location / {
            root ${{ values.webRootPath }}/${{ values.repoName }};
            autoindex on;            
            try_files $uri $uri/ =404; 
        }
    }
