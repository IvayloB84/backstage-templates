apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: github-repo-demo-template-v4
  title: Create GitHub Repository with GitOps Configs
  description: Automatically provisions a new codebase and seeds tracking manifests straight into ArgoCD.
spec:
  owner: user:default/ivaylob84
  type: service

  parameters:
    - title: Provide Repository Information
      required:
        - repoName
        - repoOwner
        - serviceType
      properties:
        repoName:
          title: Repository Name
          type: string
          maxLength: 50
          pattern: '^([a-zA-Z][a-zA-Z0-9]*)(-[a-zA-Z0-9]+)*$'
        repoOwner:
          title: Repository Owner
          type: string
          default: IvayloB84
        description:
          title: Description
          type: string
        serviceType:
          title: Select Base Service Stack
          enum: [nginx, postgres, java, redis]
          enumNames: ['Nginx', 'PostgreSQL', 'Java', 'Redis']
      dependencies:
        serviceType:
          oneOf:
            - properties:
                serviceType: { enum: [nginx] }
                nginxImage: { type: string, title: "Nginx Image", default: "nginx:alpine" }
                nginxPort: { type: integer, title: "Nginx Port", default: 80, minimum: 1 }
              required: [nginxImage, nginxPort]
            - properties:
                serviceType: { enum: [postgres] }
                postgresImage: { type: string, title: "PostgreSQL Image", default: "postgres:16-alpine" }
                postgresPort: { type: integer, title: "PostgreSQL Port", default: 5432, minimum: 1 }
              required: [postgresImage, postgresPort]
            - properties:
                serviceType: { enum: [java] }
                javaImage: { type: string, title: "Java Image", default: "eclipse-temurin:21-jre" }
                javaPort: { type: integer, title: "Java Port", default: 8080, minimum: 1 }
              required: [javaImage, javaPort]
            - properties:
                serviceType: { enum: [redis] }
                redisImage: { type: string, title: "Redis Image", default: "redis:alpine" }
                redisPort: { type: integer, title: "Redis Port", default: 6379, minimum: 1 }
              required: [redisImage, redisPort]

  steps:
    # Step 0: CACHE BUSTER - Generate a completely unique, timestamped dynamic string
    - id: generate-uuid
      name: Generating Unique Session Token
      action: debug:log
      input:
        message: "Session identifier instantiated for repo: ${{ parameters.repoName }}"

    # Step 1: Natively fetch ONLY skeleton manifests from your secure path
    - id: fetch-skeleton
      name: Render Template Configuration Files
      action: fetch:template
      input:
        url: 'https://github.com/${{ parameters.repoOwner }}/backstage-templates/tree/feature/test-dynamic-ports/skeleton'
        values:
          repoName: ${{ parameters.repoName }}
          repoOwner: ${{ parameters.repoOwner }}
          description: ${{ parameters.description or 'Freshly generated application.' }}
          image: ${{ parameters.nginxImage or parameters.postgresImage or parameters.javaImage or parameters.redisImage }}
          port: ${{ parameters.nginxPort or parameters.postgresPort or parameters.javaPort or parameters.redisPort }}

    # Step 2: Open a Pull Request against your central GitOps hub FIRST
    - id: publish-gitops-manifest
      name: Submit Automated Deployment Manifest to Central GitOps Hub
      action: publish:github:pull-request
      input:
        repoUrl: 'github.com?repo=ArgoCD-RootApps&owner=IvayloB84'
        token: ${{ secrets.GITHUB_TOKEN }}
        update: true
        sourcePath: '' 
        targetPath: 'argocd-apps/${{ parameters.repoName }}.yaml'
        branchName: 'argo-sync-${{ parameters.repoName }}'
        title: 'infra: register automated deployment loops for ${{ parameters.repoName }}'
        description: ${{ parameters.description or 'Automated infrastructure GitOps deployment registration manifest.' }}

    # Step 3: ATOMIC PROVISION - Create the new repository ONLY if your PR and file loads succeed
    - id: publish
      name: Provision Production Repository on GitHub
      action: publish:github
      input:
        repoUrl: 'github.com?repo=${{ parameters.repoName }}&owner=${{ parameters.repoOwner }}'
        repoVisibility: public
        defaultBranch: main
        sourcePath: .

    # Step 4: STATE SYNC - Wait for GitHub APIs and branch indexing to fully propagate
    - id: wait-for-github
      name: Synchronizing Cloud Repository State
      action: debug:wait
      input:
        seconds: 15

    # Step 5: REGISTER
    - id: register
      name: Register in Backstage Catalog
      action: catalog:register
      input:
        catalogInfoUrl: 'https://github.com/${{ parameters.repoOwner }}/${{ parameters.repoName }}/blob/main/catalog-info.yaml'

  # JUST ADD THIS TO THE VERY END OF YOUR FILE (Leave Step 5 exactly as it is)
  output:
    links:
      - title: Open Fresh Repository on GitHub
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open Backstage Catalog Entity
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}